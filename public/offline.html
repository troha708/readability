<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline — Readability</title>
    <style>
      :root { color-scheme: light dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        background: #ffffff;
        color: #111827;
        padding: 24px;
      }
      @media (prefers-color-scheme: dark) {
        body { background: #0b0f0e; color: #f3f4f6; }
        .muted { color: #9ca3af !important; }
      }
      .card { max-width: 28rem; text-align: center; }
      .bulb {
        width: 72px; height: 72px; border-radius: 18px;
        margin: 0 auto 20px;
        background: linear-gradient(#10b981, #047857);
        display: flex; align-items: center; justify-content: center;
      }
      h1 { font-size: 1.4rem; margin: 0 0 8px; }
      p { line-height: 1.6; margin: 0 0 24px; }
      .muted { color: #6b7280; }
      button {
        font: inherit; font-weight: 600; cursor: pointer;
        background: #059669; color: #fff; border: 0;
        padding: 12px 22px; border-radius: 10px;
      }
      button:hover { background: #047857; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="bulb" aria-hidden="true">
        <svg width="40" height="40" viewBox="0 0 512 512" fill="#fff">
          <circle cx="256" cy="202" r="120" />
          <rect x="198" y="300" width="116" height="74" rx="18" />
          <rect x="222" y="374" width="68" height="30" rx="14" />
        </svg>
      </div>
      <h1>You're offline</h1>
      <p class="muted">
        This page hasn't been saved for offline reading yet. Chapters you've
        already opened are available without a connection — reconnect to load
        anything new.
      </p>
      <button onclick="location.reload()">Try again</button>
    </div>
  </body>
</html>
